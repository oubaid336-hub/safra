<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist — Safra</title>

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .wishlist-page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    .wishlist-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    @media (min-width: 640px) {
      .wishlist-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 960px) {
      .wishlist-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .wishlist-item img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 10px;
      background: var(--safra-navy, #1f2a3c);
    }

    .wishlist-item {
      display: flex;
      flex-direction: column;
    }

    .item-type-badge {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: var(--safra-terracotta, #c96f4a);
      color: #fff;
      margin-top: 0.75rem;
      width: fit-content;
    }

    .wishlist-item h3 {
      margin: 0.5rem 0 0.15rem;
    }

    .wishlist-item .location {
      font-family: 'Inter', sans-serif;
      opacity: 0.7;
      font-size: 0.9rem;
    }

    .wishlist-item .price {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      margin-top: 0.4rem;
    }

    .item-actions {
      margin-top: auto;
      padding-top: 0.85rem;
      display: flex;
      gap: 0.5rem;
    }

    .item-actions .btn {
      flex: 1;
      text-align: center;
    }

    .btn-remove {
      background: transparent;
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      padding: 0.5rem 0.75rem;
    }

    .btn-remove:hover {
      background: #fdeceb;
      border-color: #f3c2bd;
      color: #9c2b21;
    }

    #loading-state,
    #empty-state,
    #login-required-state {
      text-align: center;
      padding: 3rem 1rem;
      font-family: 'Inter', sans-serif;
      opacity: 0.8;
    }

    #empty-state,
    #login-required-state {
      display: none;
    }
  </style>
</head>
<body>

  <nav class="navbar scrolled">
    <div class="container nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-badge"><span>S</span></div>
        <span class="nav-logo-text">Safra</span>
      </a>
      
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="houses.html" class="nav-link">Houses</a>
        <a href="cars.html" class="nav-link">Cars</a>
        <a href="faq.html" class="nav-link">FAQ</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </div>
      <div class="nav-auth">
        <a href="login.html" class="nav-auth-login">Log in</a>
        <a href="signup.html" class="nav-auth-signup">Sign up</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <div class="container">
      <div class="mobile-menu" id="mobileMenu">
        <a href="index.html">Home</a>
        <a href="houses.html">Houses</a>
        <a href="cars.html">Cars</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
        <div class="divider"></div>
        <a href="login.html">Log in</a>
        <a href="signup.html">Sign up</a>
      </div>
    </div>
  </nav>

  <main class="wishlist-page">
    <h1>My Wishlist</h1>

    <div id="loading-state">Loading your wishlist…</div>

    <div id="login-required-state">
      <p>You need to be logged in to view your wishlist.</p>
      <a href="login.html?redirect=wishlist.html" class="btn">Log In</a>
    </div>

    <div id="empty-state">
      <p>Nothing saved yet. Browse houses and cars and tap the heart icon to add them here.</p>
      <a href="houses.html" class="btn">Browse Houses</a>
    </div>

    <div id="wishlist-grid" class="wishlist-grid"></div>
  </main>

  <script src="js/config.js"></script>
<script src="js/nav-auth.js"></script>
<script src="js/nav.js"></script>
  <script src="js/wishlist.js"></script>
</body>
</html>
