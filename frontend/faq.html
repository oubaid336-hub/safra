  <style>
    .faq-page {
  max-width: 760px;
  margin: 0 auto;
  padding: 120px 1.25rem 4rem; /* Fixed: added top padding for navbar */
}

.faq-list {
  margin-top: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.faq-item {
  overflow: hidden;
  background: #fff;
  border-radius: 12px;
  padding: 20px 24px;
  box-shadow: 0 2px 8px rgba(15, 23, 42, .06);
  margin-bottom: 0.75rem;
  transition: box-shadow 0.2s ease;
}

.faq-item:hover {
  box-shadow: 0 4px 16px rgba(15, 23, 42, .1);
}

.faq-question {
  width: 100%;
  background: none;
  border: none;
  text-align: left;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 0;
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--safra-navy);
}

.faq-question .chevron {
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  opacity: 0.5;
  transition: transform 0.2s ease;
  flex-shrink: 0;
  color: var(--safra-terracotta);
}

.faq-item.open .faq-question .chevron {
  transform: rotate(180deg);
}

.faq-answer {
  font-family: 'Inter', sans-serif;
  line-height: 1.6;
  color: var(--safra-gray);
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.25s ease, margin-top 0.25s ease;
  margin-top: 0;
}

.faq-item.open .faq-answer {
  margin-top: 0.75rem;
}

#loading-state,
#empty-state {
  text-align: center;
  padding: 3rem 1rem;
  font-family: 'Inter', sans-serif;
  opacity: 0.75;
}

#empty-state {
  display: none;
}

.contact-cta {
  margin-top: 2.5rem;
  text-align: center;
  font-family: 'Inter', sans-serif;
  padding: 24px;
  background: var(--safra-sandlight);
  border-radius: 12px;
}

.contact-cta a {
  color: var(--safra-terracotta);
  font-weight: 600;
  text-decoration: none;
}

.contact-cta a:hover {
  text-decoration: underline;
}

  </style>
