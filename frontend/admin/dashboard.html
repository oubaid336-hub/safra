<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Safra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body.admin-shell {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #F4F2ED;
    min-height: 100vh;
  }

  .admin-topbar {
    background: var(--safra-navy, #1B2A41);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
  }
  .admin-topbar .brand {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
  }
  .admin-topbar .brand span {
    opacity: 0.65;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    margin-left: 8px;
  }
  #logoutBtn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #logoutBtn:hover { background: rgba(255,255,255,0.1); }

  .admin-nav {
    background: #fff;
    border-bottom: 1px solid #E5DFD2;
    padding: 0 24px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
  }
  .admin-nav a {
    display: inline-block;
    padding: 14px 14px;
    font-size: 13px;
    font-weight: 600;
    color: #6B6558;
    text-decoration: none;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
  }
  .admin-nav a.active {
    color: var(--safra-navy, #1B2A41);
    border-bottom-color: var(--safra-terracotta, #D97757);
  }

  .admin-main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }
  .admin-main h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: var(--safra-navy, #1B2A41);
    margin: 0 0 6px;
  }
  .admin-main p.sub {
    color: #8A8377;
    font-size: 14px;
    margin: 0 0 28px;
  }

  #statusBanner {
    display: none;
    margin-bottom: 24px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    background: #FBEAE9;
    color: #8C2E27;
    border: 1px solid #F0C4C0;
  }
  #statusBanner.show { display: block; }

  #statsGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .stat-card {
    background: #fff;
    border-radius: 14px;
    padding: 22px 20px;
    box-shadow: 0 2px 12px rgba(27,42,65,0.06);
  }
  .stat-card .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    color: var(--safra-navy, #1B2A41);
    font-weight: 700;
    line-height: 1;
    margin-bottom: 8px;
  }
  .stat-card .stat-label {
    font-size: 13px;
    color: #8A8377;
    font-weight: 500;
  }
  .stat-card.nested {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
  }
  .stat-card.nested .stat-label.group-label {
    width: 100%;
    font-weight: 700;
    color: var(--safra-navy, #1B2A41);
    font-size: 14px;
    margin-bottom: 4px;
  }

  #loadingMsg {
    color: #8A8377;
    font-size: 14px;
  }

  #emptyMsg {
    display: none;
    color: #8A8377;
    font-size: 14px;
  }
</style>
</head>
<body class="admin-shell">

<div class="admin-topbar">
  <div class="brand">Safra <span>Admin</span></div>
  <button id="logoutBtn">Log Out</button>
</div>

<nav class="admin-nav">
  <a href="dashboard.html" class="active">Dashboard</a>
  <a href="houses.html">Houses &amp; Cars</a>
  <a href="bookings.html">Bookings</a>
  <a href="users.html">Users</a>
  <a href="reviews.html">Reviews</a>
  <a href="faq-manager.html">FAQ</a>
  <a href="contact-messages.html">Contact Messages</a>
  <a href="support-settings.html">Support Settings</a>
  <a href="site-settings.html">Site Settings</a>
  <a href="admin-featured.html">Featured Listings</a>
  <a href="../index.html">Back to Site</a>
</nav>

<main class="admin-main">
  <h1>Dashboard</h1>
  <p class="sub">Overview of what's happening on Safra right now.</p>

  <div id="statusBanner" role="alert" aria-live="polite"></div>
  <p id="loadingMsg">Loading stats...</p>
  <p id="emptyMsg">No stats returned by the server.</p>
  <div id="statsGrid"></div>
</main>

<script src="../js/config.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
