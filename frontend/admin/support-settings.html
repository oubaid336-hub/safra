<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Settings — Admin</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  #settings-form { max-width:500px; }
  #settings-form label { display:block; margin-top:12px; font-weight:600; }
  #settings-form input { width:100%; padding:8px; box-sizing:border-box; margin-top:4px; }
  #save-btn { margin-top:20px; }
</style>
</head>
<body>
<div id="admin-nav"></div>
<main style="max-width:600px;margin:0 auto;padding:20px;">
  <h1>Support Settings</h1>
  <div id="status"></div>
  <form id="settings-form">
    <label>Support Email</label>
    <input type="email" id="supportEmail">
    <label>Support Phone</label>
    <input type="text" id="supportPhone">
    <label>Support Hours</label>
    <input type="text" id="supportHours" placeholder="e.g. Mon-Fri 9am-6pm">
    <label>WhatsApp Number</label>
    <input type="text" id="whatsappNumber">
    <button type="submit" id="save-btn">Save</button>
  </form>
</main>
<script src="js/support-settings.js"></script>
</body>
</html>
