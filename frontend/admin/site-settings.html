<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Settings — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body.admin-shell { margin:0; font-family:'Inter', sans-serif; background:#F4F2ED; min-height:100vh; }
  .admin-topbar { background: var(--safra-navy, #1B2A41); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:16px 24px; }
  .admin-topbar .brand { font-family:'Playfair Display', serif; font-size:20px; font-weight:700; }
  .admin-topbar .brand span { opacity:0.65; font-family:'Inter', sans-serif; font-size:13px; font-weight:500; margin-left:8px; }
  #logoutBtn { background:transparent; border:1px solid rgba(255,255,255,0.4); color:#fff; padding:8px 16px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; }
  #logoutBtn:hover { background: rgba(255,255,255,0.1); }
  .admin-nav { background:#fff; border-bottom:1px solid #E5DFD2; padding:0 24px; display:flex; gap:4px; overflow-x:auto; }
  .admin-nav a { display:inline-block; padding:14px 14px; font-size:13px; font-weight:600; color:#6B6558; text-decoration:none; white-space:nowrap; border-bottom:2px solid transparent; }
  .admin-nav a.active { color: var(--safra-navy, #1B2A41); border-bottom-color: var(--safra-terracotta, #D97757); }
  #settings-form { max-width:500px; }
  #settings-form label { display:block; margin-top:12px; font-weight:600; }
  #settings-form input, #settings-form select { width:100%; padding:8px; box-sizing:border-box; margin-top:4px; }
  .checkbox-row { display:flex; align-items:center; gap:8px; margin-top:16px; }
  .checkbox-row input { width:auto; margin:0; }
  #save-btn { margin-top:20px; }
  #badge-preview { width:40px; height:40px; border-radius:12px; background:var(--safra-terracotta,#C45C3E); display:flex; align-items:center; justify-content:center; margin-top:8px; }
  #badge-preview span { color:#fff; font-weight:700; font-size:18px; font-family:'Playfair Display', serif; }
</style>
</head>
<body class="admin-shell">

<div class="admin-topbar">
  <div class="brand">Safra <span>Admin</span></div>
  <button id="logoutBtn">Log Out</button>
</div>

<nav class="admin-nav">
  <a href="dashboard.html">Dashboard</a>
  <a href="houses.html">Houses &amp; Cars</a>
  <a href="bookings.html">Bookings</a>
  <a href="users.html">Users</a>
  <a href="reviews.html">Reviews</a>
  <a href="faq-manager.html">FAQ</a>
  <a href="contact-messages.html">Contact Messages</a>
  <a href="support-settings.html">Support Settings</a>
  <a href="site-settings.html" class="active">Site Settings</a>
  <a href="admin-featured.html">Featured Listings</a>
  <a href="../index.html">Back to Site</a>
</nav>

<main style="max-width:600px;margin:0 auto;padding:20px;">
  <h1>Site Settings</h1>
  <div id="status"></div>
  <form id="settings-form">
    <label>Site Name</label>
    <input type="text" id="siteName">

    <label>Logo Badge Letter</label>
    <input type="text" id="logoText" maxlength="2">
    <div id="badge-preview"><span id="badge-letter">S</span></div>

    <label>Currency</label>
    <select id="currency">
      <option value="USD">USD ($)</option>
      <option value="EUR">EUR (€)</option>
      <option value="TND">Dinar Tunisien (TND)</option>
    </select>

    <div class="checkbox-row">
      <input type="checkbox" id="maintenanceMode">
      <label style="margin:0;">Maintenance Mode</label>
    </div>

    <button type="submit" id="save-btn">Save</button>
  </form>
</main>
<script src="../js/config.js"></script>
<script src="js/site-settings.js"></script>
</body>
</html>
