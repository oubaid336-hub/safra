<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Safra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body.admin-login {
    background: var(--safra-navy, #1B2A41);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
  }
  .admin-login-card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .admin-login-card h1 {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    color: var(--safra-navy, #1B2A41);
    margin: 0 0 4px;
    text-align: center;
  }
  .admin-login-card p.sub {
    text-align: center;
    color: #8A8377;
    font-size: 13px;
    margin: 0 0 28px;
  }
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-weight: 600;
    font-size: 13px;
    color: var(--safra-navy, #1B2A41);
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 11px 13px;
    border: 1px solid #DDD5C8;
    border-radius: 8px;
    background: #FBFAF7;
    box-sizing: border-box;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--safra-navy, #1B2A41);
  }
  .admin-submit {
    width: 100%;
    padding: 13px;
    font-weight: 600;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background: var(--safra-navy, #1B2A41);
    color: #fff;
    cursor: pointer;
    margin-top: 6px;
  }
  .admin-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .form-banner {
    display: none;
    margin-bottom: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
  }
  .form-banner.show { display: block; }
  .form-banner.error {
    background: #FBEAE9;
    color: #8C2E27;
    border: 1px solid #F0C4C0;
  }
</style>
</head>
<body class="admin-login">

<div class="admin-login-card">
  <h1>Safra Admin</h1>
  <p class="sub">Staff sign-in only</p>

  <div id="formBanner" class="form-banner" role="alert" aria-live="polite"></div>

  <form id="adminLoginForm" novalidate>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="admin-submit" id="submitBtn">Log In</button>
  </form>
</div>

<script src="../js/config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
