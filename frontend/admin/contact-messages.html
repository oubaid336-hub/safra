<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Messages — Admin</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .msg-card { border:1px solid #ddd; border-radius:8px; padding:16px; margin-bottom:12px; }
  .msg-card.handled { opacity:0.55; }
  .msg-header { display:flex; justify-content:space-between; align-items:center; }
  .badge { padding:2px 10px; border-radius:12px; font-size:0.8rem; }
  .badge.new { background:#fde68a; color:#92400e; }
  .badge.handled { background:#bbf7d0; color:#166534; }
  .msg-actions button { margin-left:8px; }
</style>
</head>
<body>
<div id="admin-nav"></div>
<main style="max-width:800px;margin:0 auto;padding:20px;">
  <h1>Contact Messages</h1>
  <div id="status"></div>
  <div id="messages-list"></div>
</main>
<script src="js/contact-messages.js"></script>
</body>
</html>
