<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Details — Safra</title>

  <!-- Shared design-system stylesheet (colors, fonts, .btn/.nav/.card-style) -->
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* Page-specific styles only — mirrors the pattern used in
       booking.html. Move anything reusable into style.css later if
       it turns out to be shared across more pages. */

    .car-detail-page {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    .car-photo {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 12px;
      background: var(--safra-navy, #1f2a3c);
    }

    .car-header {
      margin-top: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
    }

    .car-header h1 {
      margin: 0;
    }

    .car-price {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1.25rem;
    }

    .car-location {
      opacity: 0.75;
      margin-top: 0.25rem;
      font-family: 'Inter', sans-serif;
    }

    .car-specs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .spec-item {
      font-family: 'Inter', sans-serif;
    }

    .spec-item .label {
      font-size: 0.8rem;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .spec-item .value {
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 0.15rem;
    }

    .car-description {
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      margin: 1.5rem 0;
    }

    #loading-state,
    #not-found-state {
      text-align: center;
      padding: 3rem 1rem;
      font-family: 'Inter', sans-serif;
      opacity: 0.75;
    }

    #not-found-state {
      display: none;
    }

    #car-content {
      display: none;
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">Safra</a>
    <a href="houses.html">Houses</a>
    <a href="cars.html">Cars</a>
  </nav>

  <main class="car-detail-page">

    <div id="loading-state">Loading car details…</div>

    <div id="not-found-state">
      <p>We couldn't find that car. It may have been removed or the link is incorrect.</p>
      <a href="cars.html" class="btn">Browse Cars</a>
    </div>

    <div id="car-content" class="card-style">
      <img id="car-photo" class="car-photo" src="" alt="" />

      <div class="car-header">
        <h1 id="car-title">—</h1>
        <span class="car-price" id="car-price">—</span>
      </div>

      <p class="car-location" id="car-location">—</p>

      <div class="car-specs">
        <div class="spec-item">
          <div class="label">Seats</div>
          <div class="value" id="car-seats">—</div>
        </div>
        <div class="spec-item">
          <div class="label">Transmission</div>
          <div class="value" id="car-transmission">—</div>
        </div>
        <div class="spec-item">
          <div class="label">Year</div>
          <div class="value" id="car-year">—</div>
        </div>
      </div>

      <p class="car-description" id="car-description">—</p>

      <a href="#" id="book-car-btn" class="btn">Book This Car</a>
    </div>

  </main>

  <script src="js/config.js"></script>
  <script src="js/car-detail.js"></script>
</body>
</html>
