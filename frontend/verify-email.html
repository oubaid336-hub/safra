<!DOCTYPE html>

<head>

  <style>
    .auth-page { min-height: 100vh; display: flex; flex-direction: column; }
    .auth-main {
      flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
      padding: 120px 20px 60px;
    }
    .auth-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    .auth-overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.55); z-index: 0; }

    .auth-card {
      position: relative; z-index: 1; width: 100%; max-width: 460px;
      background: #fff; border-radius: 20px; padding: 36px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .auth-card h1 {
      font-family: 'Playfair Display', serif; font-weight: 700;
      color: var(--safra-navy); font-size: 1.75rem; margin-bottom: 6px;
    }
    .auth-card .subtitle { color: var(--safra-gray); font-size: 14px; margin-bottom: 28px; }

    .verify-icon { margin: 0 auto 20px; width: 56px; height: 56px; }
    .verify-spinner {
      width: 40px; height: 40px; border: 3px solid var(--safra-sanddark);
      border-top-color: var(--safra-terracotta); border-radius: 50%;
      margin: 0 auto 20px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .auth-error {
      display: none; padding: 10px 14px; border-radius: 10px; margin-bottom: 18px;
      background: #FEE2E2; color: #991B1B; font-size: 13px; border: 1px solid #FECACA;
    }
    .auth-error.show { display: block; }

    .auth-success {
      display: none; padding: 10px 14px; border-radius: 10px; margin-bottom: 18px;
      background: #DCFCE7; color: #166534; font-size: 13px; border: 1px solid #BBF7D0;
    }
    .auth-success.show { display: block; }

    .auth-submit { width: 100%; margin-top: 8px; }
    .auth-switch { text-align: center; margin-top: 18px; font-size: 14px; color: var(--safra-gray); }
    .auth-switch a { color: var(--safra-terracotta); font-weight: 600; }
    .auth-switch a:hover { text-decoration: underline; }

    @media (min-width: 768px) {
      .auth-card { padding: 44px 40px; }
      .auth-card h1 { font-size: 2rem; }
    }
  </style>
</head>

  <script src="js/config.js"></script>
<script src="js/nav-auth.js"></script>

  <script>
    const navToggle = document.getElementById('navToggle');
    const mobileMenu = document.getElementById('mobileMenu');
    navToggle.addEventListener('click', () => mobileMenu.classList.toggle('open'));
    mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => mobileMenu.classList.remove('open')));

    const loadingState = document.getElementById('loadingState');
    const resultState = document.getElementById('resultState');
    const verifyError = document.getElementById('verifyError');
    const verifySuccess = document.getElementById('verifySuccess');
    const resultTitle = document.getElementById('resultTitle');
    const resultSubtitle = document.getElementById('resultSubtitle');
    const continueBtn = document.getElementById('continueBtn');

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    async function verify() {
      if (!token) {
        showResult(false, 'Invalid link', 'No verification token was found in this link.');
        return;
      }
      try {
        const res = await fetch(`${API_BASE_URL}/api/auth/verify/${token}`);
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          showResult(false, 'Verification failed', data.message || 'This link is invalid or has expired.');
          return;
        }

        showResult(true, 'Email verified!', 'Your account is ready. Redirecting to login...');
        setTimeout(() => { window.location.replace('login.html'); }, 2500);
      } catch (err) {
        showResult(false, 'Network error', 'Check your connection and try refreshing this page.');
      }
    }

    function showResult(success, title, subtitle) {
      loadingState.style.display = 'none';
      resultState.style.display = 'block';
      resultTitle.textContent = title;
      resultSubtitle.textContent = subtitle;
      if (success) {
        verifySuccess.textContent = subtitle;
        verifySuccess.classList.add('show');
      } else {
        verifyError.textContent = subtitle;
        verifyError.classList.add('show');
        continueBtn.style.display = 'inline-block';
        continueBtn.textContent = 'Go to Login';
      }
    }

    verify();
  </script>

</html>
