<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings — Safra</title>

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .bookings-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    .booking-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .booking-card {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .booking-info h3 {
      margin: 0 0 0.25rem;
    }

    .booking-meta {
      font-family: 'Inter', sans-serif;
      opacity: 0.75;
      font-size: 0.9rem;
      margin: 0.15rem 0;
    }

    .booking-type-badge {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: var(--safra-navy, #1f2a3c);
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .booking-status-block {
      text-align: right;
      min-width: 200px;
    }

    .status-badge {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
    }

    .status-badge.pending {
      background: #fff6e5;
      color: #8a5b00;
    }

    .status-badge.confirmed {
      background: #eaf6ee;
      color: #1f6b3a;
    }

    .status-badge.cancelled {
      background: #fdeceb;
      color: #9c2b21;
    }

    .status-note {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 0.4rem;
      max-width: 220px;
      margin-left: auto;
    }

    .booking-total {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    #loading-state,
    #empty-state,
    #login-required-state {
      text-align: center;
      padding: 3rem 1rem;
      font-family: 'Inter', sans-serif;
      opacity: 0.8;
    }

    #empty-state,
    #login-required-state {
      display: none;
    }
  </style>
</head>
<body>

  <nav class="navbar scrolled">
    <div class="container nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-badge"><span>S</span></div>
        <span class="nav-logo-text">Safra</span>
      </a>
      <div class="nav-icon-links">
        <a href="houses.html" class="nav-icon-link" aria-label="Houses" title="Houses">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        </a>
        <a href="cars.html" class="nav-icon-link" aria-label="Cars" title="Cars">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l2-6a2 2 0 012-2h10a2 2 0 012 2l2 6"/><rect x="2" y="13" width="20" height="6" rx="2"/><circle cx="7" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>
        </a>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="faq.html" class="nav-link">FAQ</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </div>
      <div class="nav-auth">
        <a href="login.html" class="nav-auth-login">Log in</a>
        <a href="signup.html" class="nav-auth-signup">Sign up</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <div class="container">
      <div class="mobile-menu" id="mobileMenu">
        <a href="index.html">Home</a>
        <a href="houses.html">Houses</a>
        <a href="cars.html">Cars</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
        <div class="divider"></div>
        <a href="login.html">Log in</a>
        <a href="signup.html">Sign up</a>
      </div>
    </div>
  </nav>

  <main class="bookings-page">
    <h1>My Bookings</h1>

    <div id="loading-state">Loading your bookings…</div>

    <div id="login-required-state">
      <p>You need to be logged in to view your bookings.</p>
      <a href="login.html?redirect=my-bookings.html" class="btn">Log In</a>
    </div>

    <div id="empty-state">
      <p>You haven't booked anything yet.</p>
      <a href="houses.html" class="btn">Browse Houses</a>
    </div>

    <div id="booking-list" class="booking-list"></div>
  </main>

  <script src="js/config.js"></script>
<script src="js/nav-auth.js"></script>
<script src="js/nav.js"></script>
  <script src="js/my-bookings.js"></script>
</body>
</html>
