<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings — Safra</title>

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .bookings-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 120px 1.25rem 4rem;
    }

    .bookings-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .bookings-header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 2rem;
      color: var(--safra-navy);
      margin-bottom: 8px;
    }

    .bookings-header p {
      color: var(--safra-gray);
      font-size: 15px;
    }

    .booking-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .booking-card {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(15, 23, 42, .08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .booking-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(15, 23, 42, .12);
    }

    .booking-info {
      flex: 1;
      min-width: 200px;
    }

    .booking-info h3 {
      margin: 0 0 0.25rem;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--safra-navy);
      font-size: 1.15rem;
    }

    .booking-meta {
      font-family: 'Inter', sans-serif;
      opacity: 0.75;
      font-size: 0.9rem;
      margin: 0.15rem 0;
      color: var(--safra-gray);
    }

    .booking-type-badge {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: var(--safra-navy, #1f2a3c);
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .booking-type-badge.car {
      background: var(--safra-bluelight, #2A5A8C);
    }

    .booking-status-block {
      text-align: right;
      min-width: 180px;
    }

    .status-badge {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
    }

    .status-badge.pending {
      background: #FFF6E5;
      color: #8A5B00;
    }

    .status-badge.confirmed {
      background: #E8F3E8;
      color: #1E5E20;
    }

    .status-badge.cancelled {
      background: #FBEAE9;
      color: #8C2E27;
    }

    .status-note {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 0.5rem;
      max-width: 220px;
      margin-left: auto;
      color: var(--safra-gray);
    }

    .cancel-booking-btn {
      display: inline-block;
      margin-top: 0.6rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: #8C2E27;
      background: none;
      border: 1px solid #E8B4AE;
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .cancel-booking-btn:hover {
      background: #FBEAE9;
    }

    .booking-total {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      color: var(--safra-navy);
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    #loading-state,
    #empty-state,
    #login-required-state {
      text-align: center;
      padding: 3rem 1rem;
      font-family: 'Inter', sans-serif;
      color: var(--safra-gray);
    }

    #empty-state,
    #login-required-state {
      display: none;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      color: var(--safra-sanddark);
    }

    @media (max-width: 640px) {
      .booking-card {
        flex-direction: column;
        align-items: flex-start;
      }

      .booking-status-block {
        text-align: left;
        width: 100%;
        min-width: 0;
      }

      .status-note {
        margin-left: 0;
      }
    }
  </style>
</head>

  <main class="bookings-page">
    <div class="bookings-header">
      <h1>My Bookings</h1>
      <p>All your reservations in one place.</p>
    </div>

    <div id="loading-state">Loading your bookings…</div>

    <div id="login-required-state">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <p>You need to be logged in to view your bookings.</p>
      <a href="login.html?redirect=my-bookings.html" class="btn btn-terracotta">Log In</a>

    <div id="empty-state">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
