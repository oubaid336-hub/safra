<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings — Safra</title>

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .bookings-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    .booking-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .booking-card {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .booking-info h3 {
      margin: 0 0 0.25rem;
    }

    .booking-meta {
      font-family: 'Inter', sans-serif;
      opacity: 0.75;
      font-size: 0.9rem;
      margin: 0.15rem 0;
    }

    .booking-type-badge {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: var(--safra-navy, #1f2a3c);
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .booking-status-block {
      text-align: right;
      min-width: 200px;
    }

    .status-badge {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
    }

    .status-badge.pending {
      background: #fff6e5;
      color: #8a5b00;
    }

    .status-badge.confirmed {
      background: #eaf6ee;
      color: #1f6b3a;
    }

    .status-badge.cancelled {
      background: #fdeceb;
      color: #9c2b21;
    }

    .status-note {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 0.4rem;
      max-width: 220px;
      margin-left: auto;
    }

    .booking-total {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    #loading-state,
    #empty-state,
    #login-required-state {
      text-align: center;
      padding: 3rem 1rem;
      font-family: 'Inter', sans-serif;
      opacity: 0.8;
    }

    #empty-state,
    #login-required-state {
      display: none;
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">Safra</a>
    <a href="houses.html">Houses</a>
    <a href="cars.html">Cars</a>
    <a href="wishlist.html">Wishlist</a>
  </nav>

  <main class="bookings-page">
    <h1>My Bookings</h1>

    <div id="loading-state">Loading your bookings…</div>

    <div id="login-required-state">
      <p>You need to be logged in to view your bookings.</p>
      <a href="login.html?redirect=my-bookings.html" class="btn">Log In</a>
    </div>

    <div id="empty-state">
      <p>You haven't booked anything yet.</p>
      <a href="houses.html" class="btn">Browse Houses</a>
    </div>

    <div id="booking-list" class="booking-list"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/my-bookings.js"></script>
</body>
</html>
