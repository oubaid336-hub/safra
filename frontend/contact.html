<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Safra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .contact-hero {
    padding: 64px 24px 40px;
    text-align: center;
    background: var(--safra-cream, #F7F3EC);
  }
  .contact-hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 40px);
    color: var(--safra-navy, #1B2A41);
    margin-bottom: 12px;
  }
  .contact-hero p {
    font-family: 'Inter', sans-serif;
    color: var(--safra-charcoal, #4A4A4A);
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.6;
  }
  .contact-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  .contact-form {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 4px 24px rgba(27, 42, 65, 0.08);
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--safra-navy, #1B2A41);
    margin-bottom: 6px;
  }
  .form-group input,
  .form-group textarea {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    border: 1px solid #DDD5C8;
    border-radius: 10px;
    background: #FBFAF7;
    color: var(--safra-charcoal, #2A2A2A);
    box-sizing: border-box;
    transition: border-color 0.15s ease;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--safra-terracotta, #D97757);
  }
  .form-group textarea {
    min-height: 140px;
    resize: vertical;
  }
  .field-error {
    color: #B3261E;
    font-size: 13px;
    margin-top: 4px;
    min-height: 16px;
  }
  .contact-submit {
    width: 100%;
    padding: 14px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    background: var(--safra-terracotta, #D97757);
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .contact-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .form-banner {
    display: none;
    margin-bottom: 20px;
    padding: 14px 16px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .form-banner.show { display: block; }
  .form-banner.success {
    background: #E8F3E8;
    color: #1E5E20;
    border: 1px solid #B7DDB8;
  }
  .form-banner.error {
    background: #FBEAE9;
    color: #8C2E27;
    border: 1px solid #F0C4C0;
  }
  .navbar { display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px; font-family: 'Inter', sans-serif; border-bottom: 1px solid #EEE7DA; }
  .nav-logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700;
    color: var(--safra-navy, #1B2A41); text-decoration: none; }
  .nav-links { list-style: none; display: none; gap: 24px; margin: 0; padding: 0; }
  .nav-links a { text-decoration: none; color: var(--safra-navy, #1B2A41); font-weight: 500; }
  .nav-links a.active { color: var(--safra-terracotta, #D97757); }
  .nav-auth { display: none; gap: 12px; }
  .btn { padding: 10px 20px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 14px; }
  .btn-outline { border: 1px solid var(--safra-navy, #1B2A41); color: var(--safra-navy, #1B2A41); }
  .btn-primary { background: var(--safra-terracotta, #D97757); color: #fff; }
  .nav-toggle { display: flex; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 6px; }
  .nav-toggle span { width: 24px; height: 2px; background: var(--safra-navy, #1B2A41); }
  .nav-links.open { display: flex; flex-direction: column; position: absolute; top: 64px; left: 0; right: 0;
    background: #fff; padding: 20px 24px; box-shadow: 0 8px 16px rgba(0,0,0,0.08); }
  footer { text-align: center; padding: 32px 24px; font-family: 'Inter', sans-serif;
    color: #8A8377; font-size: 13px; border-top: 1px solid #EEE7DA; }
  @media (min-width: 768px) {
    .nav-toggle { display: none; }
    .nav-links { display: flex; position: static; box-shadow: none; padding: 0; }
    .nav-auth { display: flex; }
  }
</style>
</head>
<body class="contact-page">

<nav class="navbar">
  <a href="index.html" class="nav-logo">Safra</a>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="houses.html">Houses</a></li>
    <li><a href="cars.html">Cars</a></li>
    <li><a href="wishlist.html">Wishlist</a></li>
    <li><a href="my-bookings.html">My Bookings</a></li>
    <li><a href="faq.html">FAQ</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
  <div class="nav-auth">
    <a href="login.html" class="btn btn-outline">Log In</a>
    <a href="signup.html" class="btn btn-primary">Sign Up</a>
  </div>
</nav>

<section class="contact-hero">
  <h1>Get in Touch</h1>
  <p>Questions about a booking, a listing, or anything else? Send us a message and we'll get back to you.</p>
</section>

<main class="contact-wrap">
  <div id="formBanner" class="form-banner" role="alert" aria-live="polite"></div>

  <form class="contact-form" id="contactForm" novalidate>
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name" required>
      <div class="field-error" id="nameError"></div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
      <div class="field-error" id="emailError"></div>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
      <div class="field-error" id="messageError"></div>
    </div>

    <button type="submit" class="contact-submit" id="submitBtn">Send Message</button>
  </form>
</main>

<footer>
  &copy; 2026 Safra. All rights reserved.
</footer>

<script src="js/config.js"></script>
<script src="js/nav-auth.js"></script>
<script src="js/contact.js"></script>
<script>
  // Mobile nav toggle (this page uses its own navbar markup/classes, separate from the shared nav.js)
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  if (navToggle && navLinks) {
    navToggle.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', String(isOpen));
    });
    navLinks.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', () => navLinks.classList.remove('open'));
    });
  }
</script>
</body>
</html>
